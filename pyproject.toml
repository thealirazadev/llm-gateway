[project]
name = "llm-gateway"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible LLM gateway with virtual keys, budgets, and cost audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "httpx==0.28.1",
]

[project.scripts]
lgw = "app.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.8.4",
    "black==26.10.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-as-default-argument is the standard DI pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Alembic writes migration files; applied migrations are never edited, even for formatting.
extend-exclude = "migrations/versions/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
